services:
  postgres:
    image: postgres:16
    container_name: marche-dore-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: marche
      POSTGRES_PASSWORD: marche_local
      POSTGRES_DB: marche_dore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marche -d marche_dore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
